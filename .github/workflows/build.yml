name: Build Thai Translator 1.21.11 Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build Mod JAR
        run: gradle build
      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThaiTranslator-1.21.11-1.0.0
          path: build/libs/*.jar
